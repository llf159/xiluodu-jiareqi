dataBits=8
device=/dev/ttyUSB0
enabled=true
frameDelayMs=5
name=RS485-A
parity=N
stopBits=1

[Port1]
baudRate=19200
dataBits=8
device=COM4
enabled=false
frameDelayMs=5
name=RS485-B
parity=N
stopBits=1
